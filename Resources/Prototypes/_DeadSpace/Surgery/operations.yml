# Операции: шаги, условия доступности, осложнения и последствия.

# Вскрытие: разрез + растянуть.
- type: surgery
  id: SurgeryOpening
  name: surgery-opening
  description: surgery-opening-desc
  priority: 0
  steps:
    - SurgeryStepIncision
    - SurgeryStepRetract
  conditions:
    - !type:SurgeryConditionMobState
      states: [Alive, Critical]
  complications:
    - SurgeryComplicationInfection
    - SurgeryComplicationContamination
    - SurgeryComplicationBleeding
  effects:
    - !type:SurgeryEntityEffect
      target: Patient
      effects:
        - !type:HealthChange
          damage:
            types:
              Slash: -2

# Ушивание: зажать сосуды + прижечь. Доступно только после вскрытия.
- type: surgery
  id: SurgeryClosing
  name: surgery-closing
  description: surgery-closing-desc
  priority: 0
  requires:
    - SurgeryOpening
  steps:
    - SurgeryStepClamp
    - SurgeryStepCauterize
  conditions:
    - !type:SurgeryConditionMobState
      states: [Alive, Critical]
  complications:
    - SurgeryComplicationInfection
    - SurgeryComplicationContamination

# Операция только для дионы: разрез (топором/пилой) и заращивание смолой руками.
# Показывает развилку на уровне самой операции, а не шага.
- type: surgery
  id: SurgeryDionaResinSeal
  name: surgery-diona-resin-seal
  description: surgery-diona-resin-seal-desc
  priority: 1
  steps:
    - SurgeryStepIncision
    - SurgeryStepResinSeal
  conditions:
    - !type:SurgeryConditionAnatomy
      bodies: [Diona]
    - !type:SurgeryConditionMobState
      states: [Alive, Critical]
  complications:
    - SurgeryComplicationInfection
    - SurgeryComplicationContamination
